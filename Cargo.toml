[package]
name = "pluteus-blockchain"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "=1.8.2"
chrono = "0.4.45"
hex = "0.4.3"
pqc-combo = "0.1.0"
rkyv = { version = "0.8.18", features = ["uuid-1"] }
starlark = "0.14.2"
uuid = { version = "1.24.1", features = ["v4"] }
async-trait = "0.1"
futures = "0.3"
libsecp256k1 = { version = "0.7", default-features = false }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rings-core = "0.12.0"
rings-transport = "0.12.0"
tokio = { version = "1", features = ["sync", "rt", "time", "macros", "rt-multi-thread"] }

[target.'cfg(target_family = "wasm")'.dependencies]
rings-core = { version = "0.12.0", default-features = false, features = ["wasm"] }
rings-transport = { version = "0.12.0", default-features = false, features = ["web-sys-webrtc"] }
tokio = { version = "1", default-features = false, features = ["sync", "macros", "io-util", "rt", "time"] }


